name: Build & Push via compose (GHCR)

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # === Build & push for pushes to main (latest + short-sha) ===
      - name: Build & Push (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/bake-action@v6
        with:
          files: docker-compose.build.yml
          push: true
          targets: |
            back
            front
          set: |
            back.tags=ghcr.io/${{ env.OWNER_LC }}/to_watch_list_back:latest
            back.tags+=ghcr.io/${{ env.OWNER_LC }}/to_watch_list_back:${{ env.SHORT_SHA }}
            front.tags=ghcr.io/${{ env.OWNER_LC }}/to_watch_list_front:latest
            front.tags+=ghcr.io/${{ env.OWNER_LC }}/to_watch_list_front:${{ env.SHORT_SHA }}

      # === Build & push for release tags vX.Y.Z (version + latest) ===
      - name: Build & Push (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/bake-action@v6
        with:
          files: docker-compose.build.yml
          push: true
          targets: |
            back
            front
          set: |
            back.tags=ghcr.io/${{ env.OWNER_LC }}/to_watch_list_back:${{ github.ref_name }}
            back.tags+=ghcr.io/${{ env.OWNER_LC }}/to_watch_list_back:latest
            front.tags=ghcr.io/${{ env.OWNER_LC }}/to_watch_list_front:${{ github.ref_name }}
            front.tags+=ghcr.io/${{ env.OWNER_LC }}/to_watch_list_front:latest
